
<!DOCTYPE html>
<html>
<head>
    <title>Manage Workspaces</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <h1>Manage Workspaces</h1>

    <p>
        <a href="{{ url_for('admin_dashboard') }}">Back to Admin Dashboard</a>
    </p>

    <hr>

    <h2>Add New Workspace</h2>

    <form action="{{ url_for('admin_workspaces') }}" method="POST">

    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label>Workspace Name:</label>
    <input type="text" name="workspace_name" required>

    <br><br>

    <label>Location:</label>
    <input type="text" name="location" required>

    <br><br>

    <button type="submit">Add Workspace</button>

</form>

    <hr>

    <h2>Existing Workspaces</h2>

    {% for workspace in workspaces %}

        <h3>{{ workspace.workspace_name }}</h3>

        <p>Location: {{ workspace.location }}</p>

        <form action="{{ url_for('admin_update_workspace', workspace_id=workspace.id) }}"
      method="POST">

    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <input type="text" name="workspace_name"
           value="{{ workspace.workspace_name }}" required>

    <input type="text" name="location"
           value="{{ workspace.location }}" required>

    <button type="submit">Update</button>

</form>
        <p>
            <a href="{{ url_for('admin_seats', workspace_id=workspace.id) }}">
    Manage Seats
</a>
        </p>

        <form action="{{ url_for('admin_deactivate_workspace', workspace_id=workspace.id) }}"
      method="POST">

    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <button type="submit">Deactivate Workspace</button>

</form>

        <hr>

    {% endfor %}

    <form action="{{ url_for('logout') }}" method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit">Logout</button>
</form>
</body>
</html>
